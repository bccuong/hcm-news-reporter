name: Live data – hourly collection & GitHub Pages deploy
run-name: ${{ inputs.from && format('Thu thập theo yêu cầu {0} → {1} ({2})', inputs.from, inputs.to, inputs.requested_by) || inputs.trigger == 'auto' && 'Thu thập tự động hằng giờ' || 'Live data – collection & GitHub Pages deploy' }}

# The hourly automatic run is NOT a GitHub `schedule:` (often late or skipped). The Cloudflare review worker's cron
# trigger dispatches this workflow with trigger=auto every hour at :07 – only while "Tự động thu thập mỗi giờ" is
# switched on in the web app (KV cfg:auto) and no other collection is running.
on:
  push:
    branches: [main]
  workflow_dispatch:
    # on-demand window from the web "Thu thập" button, or trigger=auto from the worker cron
    inputs:
      trigger:
        description: 'auto = lượt tự động hằng giờ (do worker gửi)'
        required: false
        default: ''
      from:
        description: 'Từ (ISO +07:00), ví dụ 2026-11-14T17:00+07:00'
        required: false
        default: ''
      to:
        description: 'Đến (ISO +07:00, không gồm)'
        required: false
        default: ''
      requested_by:
        description: 'Người yêu cầu'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cut a running collection; runs queue instead

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real collection from the configured publishers (redacted public dataset: no full text, no photos).
      # If this step fails, the job stops and the previously deployed site stays online unchanged.
      - name: Collect live data
        env: # inputs passed through env (never interpolated into the shell command)
          REQ_FROM: ${{ inputs.from }}
          REQ_TO: ${{ inputs.to }}
          REQ_BY: ${{ inputs.requested_by }}
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }} # shared configuration edited on the web (Cài đặt)
        run: |
          if [ -n "$REQ_FROM" ]; then
            npx tsx scripts/cloud-collect.ts --site "https://bccuong.github.io/hcm-news-reporter/" --out web/public/live --from "$REQ_FROM" --to "$REQ_TO" --requested-by "$REQ_BY"
          else
            npx tsx scripts/cloud-collect.ts --site "https://bccuong.github.io/hcm-news-reporter/" --out web/public/live
          fi
      - run: npm run build:pages
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
