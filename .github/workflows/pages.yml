name: Live data – hourly collection & GitHub Pages deploy

on:
  schedule:
    - cron: '7 * * * *' # hourly (UTC; GitHub may start scheduled runs a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cut a running collection; runs queue instead

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real collection from the configured publishers (redacted public dataset: no full text, no photos).
      # If this step fails, the job stops and the previously deployed site stays online unchanged.
      - name: Collect live data
        run: npx tsx scripts/cloud-collect.ts --site "https://bccuong.github.io/hcm-news-reporter/" --out web/public/live
      - run: npm run build:pages
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
