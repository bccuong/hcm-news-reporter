name: Pull team review labels (nightly)

on:
  schedule:
    - cron: '30 16 * * *' # 23:30 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull labels from the review worker (names pseudonymised)
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        run: npx tsx scripts/pull-labels.ts
      # daily filter suggestions learned from the labels + review decisions (Cài đặt › Gợi ý cải thiện); never blocks the commit
      - name: Daily filter suggestions
        continue-on-error: true
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        run: |
          set +e
          node --version
          npx tsx scripts/suggest-filter.ts 2>&1
          echo "suggest-filter exit code $?"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labels/ || true
          if git diff --cached --quiet; then echo "no new labels"; else git commit -m "labels: nightly pull of team review labels" && git push; fi
